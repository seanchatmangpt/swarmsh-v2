name: SwarmSH v2 Completion Gate

on:
  push:
    branches:
      - master
      - 'finish/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarmsh-v2-completion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust exact-head verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Pin stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Compile every target and feature
        run: cargo check --locked --all-targets --all-features

      - name: Clippy every target and feature
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Library tests
        run: cargo test --locked --all-features --lib

      - name: Integration tests
        run: cargo test --locked --all-features --tests
