      - ref: swarmsh.worktree.coordination_epoch
        requirement_level: required
      - ref: swarmsh.worktree.lifecycle.phase
        requirement_level: required
      - ref: swarmsh.worktree.lifecycle.duration_ms
        requirement_level: recommended
      - ref: swarmsh.worktree.lifecycle.success
        requirement_level: recommended
