file_format: definition/2
spans:
  - type: swarmsh.worktree.lifecycle
    name:
      note: 'swarmsh.worktree.lifecycle {swarmsh.worktree.operation}'
    kind: internal
    stability: development
    brief: Observes a bounded worktree lifecycle transition.
    attributes:
      - ref: swarmsh.worktree.name
        requirement_level: required
      - ref: swarmsh.worktree.operation
